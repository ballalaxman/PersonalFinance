name = "fintrack"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── D1 database ────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "fintrack-db"
database_id = "039a6e44-96db-4b68-a8ae-cd94b634243a"

# ─── R2 bucket ──────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fintrack-files"
# preview_bucket_name = "fintrack-files-preview"

# ─── React static assets ────────────────────────────────────────────────────
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# ─── Secrets ────────────────────────────────────────────────────────────────
# Production secret is stored securely using:
# wrangler secret put JWT_SECRET
# Set APP_ORIGIN to the exact production frontend origin.

[vars]
APP_ORIGIN = "https://fintrack.ballalaxmanrao987.workers.dev"

# ─── Local development ──────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ─── Observability ──────────────────────────────────────────────────────────
[observability]
enabled = true

# One shared scheduler processes due recurring items for every user. Due dates
# are evaluated using each user's saved IANA timezone.
[triggers]
crons = ["*/15 * * * *"]
