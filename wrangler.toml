name = "fintrack"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── D1 database ────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "fintrack-db"
database_id = "039a6e44-96db-4b68-a8ae-cd94b634243a"

# ─── R2 bucket ──────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fintrack-files"
# preview_bucket_name = "fintrack-files-preview"

# ─── Secrets ────────────────────────────────────────────────────────────────
# Production secret is stored securely using:
# wrangler secret put JWT_SECRET

# ─── Local development ──────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ─── Observability ──────────────────────────────────────────────────────────
[observability]
enabled = true
