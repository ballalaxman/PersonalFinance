name = "fintrack"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── D1 database ────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "fintrack-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ─── R2 bucket ──────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fintrack-files"
# preview_bucket_name = "fintrack-files-preview"

# ─── Secrets ────────────────────────────────────────────────────────────────
# For local dev only — set a real secret in production with:
#   wrangler secret put JWT_SECRET
[vars]
JWT_SECRET = "change-me-in-production-use-wrangler-secret-put"

# ─── Local development ──────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ─── Observability ──────────────────────────────────────────────────────────
[observability]
enabled = true
