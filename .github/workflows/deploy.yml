name: Deploy to Cloudflare

on:
  push:
    branches:
      - main   # change to master if that's your default branch

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Type-check + build React app → dist/
      - name: Build
        run: npm run build

      # 5. Apply any pending DB migrations to production D1
      #    Uses the database_id already in wrangler.toml
      - name: Migrate production D1 database
        run: npx wrangler d1 execute fintrack-db --remote --file=worker/db/schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3d64fbe511ccdadae75013f01af535f

      # 6. Deploy Worker + static assets to Cloudflare
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3d64fbe511ccdadae75013f01af535f
